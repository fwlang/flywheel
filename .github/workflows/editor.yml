name: VS Code extension
on:
  push:
    paths: ['fw-vscode/**', 'examples/**', '.github/workflows/editor.yml']
  pull_request:
    paths: ['fw-vscode/**', 'examples/**', '.github/workflows/editor.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fw-vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fw-vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package
